services:
  - type: web
    name: eventsliner
    runtime: node
    plan: free
    region: singapore
    buildCommand: pnpm install && pnpm db:migrate:deploy && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eventsliner-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: eventsliner-redis
          property: connectionString
      - key: EMAIL_FROM
        value: noreply@eventsliner.live
      - key: RESEND_API_KEY
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        value: EVTLIN
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CRON_SECRET
        generateValue: true
  - type: redis
    name: eventsliner-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: eventsliner-db
    databaseName: eventsliner
    plan: free
    region: singapore
